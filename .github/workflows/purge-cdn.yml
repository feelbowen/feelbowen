name: Auto Purge jsDelivr CDN

on:
  push:
    branches:
      - main
    paths:
      - 'rules/**'

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2  # 更新至包含 Node 24 适配的最新补丁版本
        with:
          fetch-depth: 2

      - name: Purge Updated Files
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^rules/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "没有检测到 rules 目录下的文件变更。"
            exit 0
          fi

          echo "检测到变更文件，开始清理 jsDelivr CDN 缓存..."
          for FILE in $CHANGED_FILES; do
            URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@refs/heads/main/${FILE}"
            echo "正在 Purge: ${URL}"
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$URL")
            echo "$RESPONSE"
          done
