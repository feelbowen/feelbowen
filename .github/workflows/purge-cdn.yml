name: Auto Purge jsDelivr CDN

on:
  push:
    branches:
      - main
    paths:
      - 'rules/**'
      - 'icons/**'      # 示例：新增监控 icons 目录

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Purge Updated Files
        run: |
          # 正则匹配所有需要监控的目录前缀
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '^(rules|icons)/' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "没有检测到监控目录下的文件变更。"
            exit 0
          fi

          echo "检测到变更文件，开始清理 jsDelivr CDN 缓存..."
          for FILE in $CHANGED_FILES; do
            URL="https://purge.jsdelivr.net/gh/${{ github.repository }}@refs/heads/main/${FILE}"
            echo "正在 Purge: ${URL}"
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$URL")
            echo "$RESPONSE"
          done
